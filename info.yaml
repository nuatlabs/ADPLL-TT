# Tiny Tapeout project information
project:
  title:        "All-Digital Phase-Locked Loop (ADPLL)"
  author:       "NUAT Labs"
  discord:      ""
  description:  "All-Digital PLL with dual-stage AFC and Bang-Bang PI filter"
  language:     "Verilog"
  clock_hz:     12500000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_nuatlabs_adpll"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "adpll_digital_top.v"
    - "bbpd.v"
    - "clk_divider.v"
    - "loop_filter.v"
    - "dco_digital.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "otw_init[8]"
  ui[1]: "otw_init[9]"
  ui[2]: "otw_init[10]"
  ui[3]: "otw_init[11]"
  ui[4]: "otw_init[12]"
  ui[5]: "otw_init[13]"
  ui[6]: "otw_init[14]"
  ui[7]: "otw_init[15]"

  # Outputs
  uo[0]: "clk_out (100MHz)"
  uo[1]: "fb_clk (12.5MHz)"
  uo[2]: "freq_locked"
  uo[3]: "up_dn"
  uo[4]: "otw[12]"
  uo[5]: "otw[13]"
  uo[6]: "otw[14]"
  uo[7]: "otw[15]"

  # Bidirectional pins
  uio[0]: "otw[4]"
  uio[1]: "otw[5]"
  uio[2]: "otw[6]"
  uio[3]: "otw[7]"
  uio[4]: "otw[8]"
  uio[5]: "otw[9]"
  uio[6]: "otw[10]"
  uio[7]: "otw[11]"

# Do not change!
yaml_version: 6
